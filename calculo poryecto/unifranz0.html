<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>unifranz 0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #cccccc;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }

    header {
      background: #111111;
      padding: 10px 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    header h1 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.05em;
      font-family: Arial Black, Arial, sans-serif;
      text-transform: uppercase;
    }

    .btn-token {
      position: fixed;
      top: 12px;
      right: 16px;
      background: #1b2a3b;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px 8px 52px;
      font-size: 13px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 20;
      line-height: 1.3;
    }

    .btn-token:hover { background: #243648; }

    .btn-token .globe {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      background: #2a3f55;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* La contraseña de unifranz1 es k7Xm2Qw9pL4nRv6hYt8cZ3sJ */
    .content {
      padding-top: 80px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-left: 16px;
      padding-right: 16px;
    }

    .box {
      background: #f5f5f5;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
      padding: 32px 40px;
      max-width: 500px;
      width: 100%;
      margin-top: 20px;
      font-size: 15px;
      color: #111;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>unifranz 0</h1>
  </header>

  <div class="content">
    <div class="box">
      En esta página encontrarás la contraseña para el siguiente nivel.
    </div>
  </div>

</body>
</html>
