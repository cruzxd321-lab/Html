<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNIFRANZ 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #cccccc;
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
    }

    header {
      background: #111111;
      padding: 10px 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    header h1 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.05em;
      font-family: Arial Black, Arial, sans-serif;
      text-transform: uppercase;
    }

    .content {
      padding-top: 80px;
      display: flex;
      justify-content: center;
      padding-left: 16px;
      padding-right: 16px;
    }

    .box {
      background: #f5f5f5;
      border: 1px solid #ccc;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
      padding: 32px 40px;
      max-width: 500px;
      width: 100%;
      margin-top: 20px;
      font-size: 15px;
      color: #111;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <h1>UNIFRANZ 1</h1>
  </header>

  <div class="content">
    <div class="box">
      En esta página encontrarás la contraseña para el siguiente nivel.<br><br>
      <em>Pista: El clic derecho no siempre es tu único aliado...</em>
    </div>
  </div>

  <script>
    // Bloquear clic derecho
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });

    // Contraseña del siguiente nivel (unifranz 2): g4Nw8Xp2mKv5Rz9hYq3cT7bL
    // Para encontrarla, el usuario debe inspeccionar el código fuente de otra manera
  </script>

</body>
</html>
