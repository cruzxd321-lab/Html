<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UNIFRAZ5</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #cccccc; font-family: Georgia, serif; min-height: 100vh; }
header { background: #111; padding: 10px 16px; position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; }
header h1 { color: #fff; font-size: 20px; font-weight: 900; font-family: Arial Black, Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.05em; }
.btn-token { position: fixed; top: 10px; right: 16px; background: #1b2a3b; color: #fff; border: none; border-radius: 6px; padding: 8px 18px 8px 52px; font-size: 12px; font-family: Arial, sans-serif; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; z-index: 20; line-height: 1.4; }
.btn-token .globe { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; background: #2a3f55; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.content { padding: 80px 16px 40px; display: flex; justify-content: center; }
.box { background: #f5f5f5; border: 1px solid #ccc; box-shadow: 2px 2px 6px rgba(0,0,0,0.15); padding: 32px 40px; max-width: 520px; width: 100%; margin-top: 20px; font-size: 15px; color: #111; line-height: 1.7; }
a { color: #0000cc; }
input[type=text], input[type=password] { border: 1px solid #aaa; padding: 4px 8px; font-size: 14px; margin: 4px 2px; }
input[type=submit], button.submit { background: #ddd; border: 1px solid #999; padding: 4px 12px; font-size: 13px; cursor: pointer; margin-top: 4px; }
.result { margin-top: 12px; font-size: 13px; font-weight: bold; }
.output { margin-top: 10px; font-size: 13px; font-family: monospace; background: #eee; padding: 8px; min-height: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
  <header><h1>UNIFRAZ5</h1></header>
  <button class="btn-token"><span class="globe">&#127760;</span>ENVIAR<br>TOKEN</button>
  <div class="content">
    <div class="box">
      Acceso denegado. No has iniciado sesi&#243;n.
      <!-- Pista: revisa tus cookies con las herramientas del navegador o Burp Suite -->
    </div>
  </div>
  
<script>
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['i','I','j','J','c','C'].includes(e.key))||(e.ctrlKey&&['u','U','s','S'].includes(e.key))) e.preventDefault();
  });
</script>

  
</body>
</html>
